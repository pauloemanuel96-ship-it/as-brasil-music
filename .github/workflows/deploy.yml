# Publica o site na Locaweb por FTP a cada "git push" na branch main.
# As músicas, capas e o catálogo que você envia pelo Estúdio NÃO são apagados:
# o envio só mexe nos arquivos que estão no repositório.
# Configure os segredos em: GitHub > seu repositório > Settings > Secrets and variables > Actions
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Publicar na Locaweb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            api/config.php
